<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>Useless</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(115, 0, 0, .17), transparent 42%),
        radial-gradient(ellipse at 50% 110%, #171717 0%, #090909 58%);
    }
    main {
      width: 100%;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .button-wrap {
      --size: min(76vw, 310px);
      position: relative;
      width: var(--size);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 42%, #555 0%, #292929 61%, #101010 72%, #050505 100%);
      box-shadow:
        0 34px 48px rgba(0,0,0,.72),
        0 12px 18px rgba(0,0,0,.7),
        inset 0 2px 2px rgba(255,255,255,.28),
        inset 0 -5px 9px rgba(0,0,0,.9);
      -webkit-tap-highlight-color: transparent;
      isolation: isolate;
    }
    .button-wrap::before {
      content: "";
      position: absolute;
      inset: 3.5%;
      border-radius: 50%;
      background:
        repeating-conic-gradient(from -8deg, rgba(255,255,255,.13) 0deg 1deg, transparent 1deg 7deg),
        linear-gradient(145deg, #777 0%, #303030 22%, #111 50%, #555 76%, #171717 100%);
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,.32),
        inset 0 -4px 7px rgba(0,0,0,.9),
        0 1px 2px #000;
      z-index: -1;
    }
    .button-wrap::after {
      content: "";
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,.75);
      box-shadow:
        0 1px 1px rgba(255,255,255,.18),
        inset 0 2px 5px rgba(0,0,0,.9);
      pointer-events: none;
    }
    button {
      position: relative;
      width: 75%;
      height: 75%;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
      transform: translateY(-5px);
      background:
        radial-gradient(ellipse at 34% 17%, rgba(255,255,255,.5), transparent 25%),
        radial-gradient(ellipse at 50% 8%, #ff7777 0%, #fa3038 25%, #df071b 59%, #a90013 82%, #76000c 100%);
      box-shadow:
        inset 0 5px 5px rgba(255,255,255,.46),
        inset 0 -9px 13px rgba(65,0,8,.68),
        inset 5px 0 12px rgba(255,125,125,.19),
        0 5px 0 #79000d,
        0 10px 0 #450008,
        0 14px 17px rgba(0,0,0,.72),
        0 0 30px rgba(255,0,24,.16);
      transition:
        transform 105ms cubic-bezier(.2,.75,.3,1),
        box-shadow 105ms ease,
        filter 180ms ease;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
      user-select: none;
    }
    button::before {
      content: "";
      position: absolute;
      top: 8%;
      left: 15%;
      width: 70%;
      height: 31%;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0));
      filter: blur(3px);
      pointer-events: none;
    }
    button::after {
      content: "";
      position: absolute;
      inset: 3%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.15);
      box-shadow: inset 0 0 10px rgba(255,255,255,.08);
      pointer-events: none;
    }
    button:active, button.pressed {
      transform: translateY(7px) scale(.985);
      box-shadow:
        inset 0 7px 12px rgba(60,0,8,.62),
        inset 0 -2px 4px rgba(255,255,255,.1),
        0 1px 0 #79000d,
        0 2px 0 #450008,
        0 5px 9px rgba(0,0,0,.7),
        0 0 25px rgba(255,0,24,.2);
      filter: saturate(1.12) brightness(.94);
    }
    button:focus-visible {
      outline: 3px solid rgba(255,255,255,.85);
      outline-offset: 15px;
    }
    @media (hover: hover) {
      button:hover { filter: brightness(1.07) saturate(1.04); }
    }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="button-wrap">
      <button type="button" aria-label="Red button"></button>
    </div>
  </main>
  <script>
    const button = document.querySelector("button");
    let releaseTimer;
    let audioContext;

    function clickSound() {
      try {
        audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === "suspended") audioContext.resume();

        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        const body = audioContext.createOscillator();
        const bodyGain = audioContext.createGain();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(62, now + 0.055);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.17, now + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.075);
        osc.connect(gain).connect(audioContext.destination);
        osc.start(now);
        osc.stop(now + 0.08);

        body.type = "sine";
        body.frequency.setValueAtTime(92, now);
        body.frequency.exponentialRampToValueAtTime(42, now + 0.09);
        bodyGain.gain.setValueAtTime(0.0001, now);
        bodyGain.gain.exponentialRampToValueAtTime(0.12, now + 0.006);
        bodyGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.11);
        body.connect(bodyGain).connect(audioContext.destination);
        body.start(now);
        body.stop(now + 0.12);
      } catch (_) {
        // The button remains fully usable if audio is unavailable.
      }
    }

    button.addEventListener("click", () => {
      clearTimeout(releaseTimer);
      button.classList.add("pressed");
      clickSound();
      releaseTimer = setTimeout(() => button.classList.remove("pressed"), 145);
    });
  </script>
</body>
</html>
