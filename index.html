<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>Useless</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#090909}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#292929 0%,#131313 38%,#070707 78%)}
main{min-height:100svh;width:100%;display:grid;place-items:center;padding:24px}
.unit{width:min(86vw,380px);height:340px;display:grid;place-items:center;filter:drop-shadow(0 28px 24px #000c)}
.plate{position:relative;width:230px;height:290px;border-radius:20px;background:linear-gradient(135deg,#777 0%,#444 12%,#242424 40%,#111 72%,#333 100%);box-shadow:inset 1px 1px 2px #ffffff66,inset -3px -4px 8px #000,0 2px 4px #000}
.plate:before{content:"";position:absolute;inset:8px;border-radius:14px;border:1px solid #ffffff26;box-shadow:inset 0 1px 2px #ffffff12}
.screw{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ddd,#777 32%,#292929 75%);box-shadow:inset 0 1px 2px #fff9,0 1px 2px #000}
.screw:after{content:"";position:absolute;left:2px;right:2px;top:6px;height:2px;background:#222;transform:rotate(-35deg);box-shadow:0 1px #ffffff55}
.tl{top:17px;left:17px}.tr{top:17px;right:17px}.bl{bottom:17px;left:17px}.br{bottom:17px;right:17px}
.label{position:absolute;top:39px;color:#c7c7c7;font:700 13px Arial,sans-serif;letter-spacing:2px;text-shadow:0 2px 2px #000}
.label.off{left:48px}.label.on{right:48px}
.slot{position:absolute;left:50%;top:68px;width:130px;height:158px;transform:translateX(-50%);border-radius:65px;background:linear-gradient(90deg,#050505,#252525 18%,#080808 50%,#292929 82%,#050505);box-shadow:inset 0 8px 13px #000,0 1px 1px #ffffff30,0 6px 12px #0008}
.slot:after{content:"";position:absolute;inset:8px;border-radius:60px;border:1px solid #ffffff0b}
.control{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.control:focus-visible{outline:3px solid white;outline-offset:12px;border-radius:18px}
.lever{position:absolute;z-index:3;left:50%;top:65px;width:28px;height:145px;transform:translateX(-50%) rotate(-25deg);transform-origin:50% 88%;transition:transform 280ms cubic-bezier(.2,.8,.2,1);pointer-events:none}
.shaft{position:absolute;left:10px;top:13px;width:8px;height:120px;border-radius:5px;background:linear-gradient(90deg,#454545 0%,#f2f2f2 25%,#999 48%,#fff 66%,#414141 100%);box-shadow:1px 2px 3px #000,inset 0 0 1px #fff}
.ball{position:absolute;left:-2px;top:-2px;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 30% 23%,#777 0%,#282828 30%,#080808 72%,#000 100%);box-shadow:inset 0 2px 3px #ffffff55,0 3px 5px #000b}
.ball:after{content:"";position:absolute;left:7px;top:5px;width:11px;height:5px;border-radius:50%;background:#ffffff55;filter:blur(2px)}
.pivot{position:absolute;z-index:4;left:50%;top:190px;width:48px;height:48px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 32% 25%,#aaa,#555 35%,#171717 75%,#050505);box-shadow:inset 0 3px 4px #ffffff66,inset 0 -4px 5px #000,0 3px 4px #000}
.pivot:after{content:"";position:absolute;inset:10px;border-radius:50%;border:2px solid #111;box-shadow:0 1px 1px #ffffff44,inset 0 2px 3px #000}
.control[aria-pressed="true"] .lever{transform:translateX(-50%) rotate(25deg)}
.indicator{position:absolute;left:50%;bottom:28px;width:10px;height:10px;transform:translateX(-50%);border-radius:50%;background:#292929;box-shadow:inset 0 1px 2px #000,0 0 2px #000;transition:background .2s,box-shadow .2s}
.control[aria-pressed="true"] .indicator{background:#68ff83;box-shadow:0 0 8px #55ff78,0 0 18px #55ff7888,inset 0 1px 2px white}
@media(hover:hover){.control:hover .ball{filter:brightness(1.3)}}
@media(prefers-reduced-motion:reduce){.lever,.indicator{transition:none}}
</style>
</head>
<body>
<main>
<div class="unit">
  <div class="plate">
    <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
    <span class="label off">OFF</span><span class="label on">ON</span>
    <div class="slot" aria-hidden="true"></div>
    <button class="control" type="button" aria-label="Kippschalter" aria-pressed="false">
      <span class="lever"><span class="shaft"></span><span class="ball"></span></span>
      <span class="pivot"></span>
      <span class="indicator"></span>
    </button>
  </div>
</div>
</main>
<script>
const control=document.querySelector(".control");
let audioContext;
function clack(){
 try{
  audioContext??=new(window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==="suspended")audioContext.resume();
  const t=audioContext.currentTime;
  const osc=audioContext.createOscillator(),gain=audioContext.createGain();
  osc.type="square";osc.frequency.setValueAtTime(125,t);osc.frequency.exponentialRampToValueAtTime(42,t+.055);
  gain.gain.setValueAtTime(.09,t);gain.gain.exponentialRampToValueAtTime(.001,t+.065);
  osc.connect(gain).connect(audioContext.destination);osc.start(t);osc.stop(t+.07);
 }catch(_){}
}
control.addEventListener("click",()=>{
 control.setAttribute("aria-pressed",control.getAttribute("aria-pressed")==="true"?"false":"true");
 clack();
});
</script>
</body>
</html>
